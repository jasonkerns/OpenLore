<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Agent Harness logo: a manager hub (amber) connected to three agents (white). Source for `tauri icon`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="60" stroke-linecap="round">
    <line x1="512" y1="548" x2="512" y2="238"/>
    <line x1="512" y1="548" x2="780" y2="703"/>
    <line x1="512" y1="548" x2="244" y2="703"/>
  </g>
  <g fill="#ffffff">
    <circle cx="512" cy="238" r="92"/>
    <circle cx="780" cy="703" r="92"/>
    <circle cx="244" cy="703" r="92"/>
  </g>
  <circle cx="512" cy="548" r="132" fill="url(#hub)" stroke="#ffffff" stroke-width="28"/>
</svg>
